name: CI-PR

on:
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - macos-15
          - macos-15-intel
          - ubuntu-22.04
          - ubuntu-22.04-arm
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-2022
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup UCRT64
        id: msys2
        if: startsWith(matrix.platform, 'windows')
        uses: msys2/setup-msys2@v2
        with:
          msystem: ucrt64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
      - name: Select UCRT64 compiler
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $bin = Join-Path $env:MSYS2_ROOT 'ucrt64\bin'
          $gcc = Join-Path $bin 'gcc.exe'
          if (-not (Test-Path $gcc)) {
            throw "UCRT64 compiler not found: $gcc"
          }
          & $gcc --version
          if ($LASTEXITCODE -ne 0) {
            throw "UCRT64 compiler failed with exit code $LASTEXITCODE"
          }
          "CC=gcc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CXX=g++" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Setup go compiler
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install Neo Web
        run: go run mage.go InstallNeoWeb
      - name: Install Neo Engine
        run: go run mage.go InstallNeoEngine
      - name: Test
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "ubuntu-24.04" ]]; then
            ENABLE_DOCKER_TESTS=true go run mage.go test
          else
            go run mage.go test
          fi
      - name: Codecov
        if: matrix.platform == 'ubuntu-24.04'
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
